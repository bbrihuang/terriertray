name: refresh-menus

# Collect BU menus, validate freshness, merge with the last
# published data, publish to the `menu-data` branch, and deploy that exact data if configured.
on:
  schedule:
    - cron: "30 5 * * *"
      timezone: "America/New_York" # 05:30 New York, DST-aware
  workflow_dispatch:
    inputs:
      date:
        description: "Snapshot date label (YYYY-MM-DD, New York). Leave blank for today."
        required: false

# One refresh at a time; a queued run waits instead of racing the data branch.
concurrency:
  group: refresh-menus
  cancel-in-progress: false

permissions:
  contents: write # push the menu-data branch
  issues: write # open/update/close the single failure issue

jobs:
  refresh:
    # Never run with secrets on forks.
    if: github.repository == 'bbrihuang/terriertray'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: pip install -r collector/requirements.txt
      - run: npm ci

      - name: Load last published data
        run: |
          if git ls-remote --exit-code --heads origin menu-data >/dev/null; then
            git fetch --depth=1 origin menu-data
            rm -rf public/menus
            git --work-tree=public checkout FETCH_HEAD -- menus
            git reset -q
          else
            echo "First run: no menu-data branch yet, starting from the snapshot in main."
          fi

      - name: Collect BU menus (live)
        id: bu
        env:
          COLLECTOR_CONTACT: ${{ vars.COLLECTOR_CONTACT }}
          INPUT_DATE: ${{ inputs.date }}
        run: |
          DATE="${INPUT_DATE:-$(date +%F)}"
          [[ "$DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "Bad date"; exit 1; }
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          set +e
          (cd collector && python scripts/scrape_bu_menus.py --refresh --snapshot-date "$DATE")
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: Validate freshness (upstream validator)
        id: gate
        # All-or-nothing for the three BU halls: only a fully passed collection is validated.
        if: steps.bu.outputs.code == '0'
        run: |
          set +e
          (cd collector && python scripts/freshness_gate.py \
            --input "data/processed/terrier_trays_menus_${{ steps.bu.outputs.date }}.json" \
            --out data/processed/freshness.json --start "${{ steps.bu.outputs.date }}")
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "status=$(jq -r .validatorStatus collector/data/processed/freshness.json 2>/dev/null || echo unknown)" >> "$GITHUB_OUTPUT"

      # Fenway (Sodexo API) is deferred until its API-key requirement is resolved: no routine
      # collection. The client stays in scripts/collect-fenway.ts for manual checks.

      - name: Merge and stage public data
        id: merge
        run: |
          args=(--coverage docs/data-coverage.md)
          if [ "${{ steps.gate.outputs.code }}" = "0" ]; then
            args+=(--bu "collector/data/processed/terrier_trays_menus_${{ steps.bu.outputs.date }}.json" \
                   --freshness collector/data/processed/freshness.json)
            echo "published=new" >> "$GITHUB_OUTPUT"
          else
            echo "New BU data not published; keeping the previous snapshot and its original age."
            echo "published=previous" >> "$GITHUB_OUTPUT"
          fi
          set +e
          npx tsx scripts/build-menus.ts "${args[@]}"
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # 0 = all halls fresh, 2 = halls kept their previous snapshot. Anything else is a hard stop.
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then exit 1; fi
          echo "version=$(jq -r .dataVersion public/menus/index.json)" >> "$GITHUB_OUTPUT"

      - name: Keep run reports (30 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-reports-${{ github.run_id }}
          # Small JSON reports only; raw HTML (12-16 MB per hall) is not kept.
          path: |
            collector/data/processed/validation_*.json
            collector/data/processed/freshness.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Verify
        run: |
          npm test
          npm run build
          npm run check:secrets

      - name: Publish menu-data branch
        id: persist
        run: |
          tmp="$(mktemp -d)"
          cp -r public/menus "$tmp/menus"
          cp docs/data-coverage.md "$tmp/"
          cp collector/data/processed/validation_*.json collector/data/processed/freshness.json "$tmp/" 2>/dev/null || true
          cd "$tmp"
          git init -q -b menu-data
          git config user.name "terriertray-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Menu data ${{ steps.merge.outputs.version }} $(date -u +%FT%TZ) from ${GITHUB_SHA::7}"
          # Single-commit branch: history stays bounded; main keeps the code history.
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" menu-data
          echo "done=true" >> "$GITHUB_OUTPUT"

      - name: Deploy to Vercel
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          # Build with the data validated above, not whatever the branch holds at build time.
          TERRIERTRAY_DATA_PINNED: "1"
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "result=not configured (VERCEL_TOKEN missing)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npx --yes vercel@65.2.0 pull --yes --environment=production --token "$VERCEL_TOKEN"
          npx --yes vercel@65.2.0 build --prod --token "$VERCEL_TOKEN"
          built="$(jq -r .dataVersion .vercel/output/static/menus/index.json)"
          if [ "$built" != "${{ steps.merge.outputs.version }}" ]; then
            echo "Built data $built does not match validated ${{ steps.merge.outputs.version }}; not deploying."
            echo "result=blocked (data version mismatch)" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          npx --yes vercel@65.2.0 deploy --prebuilt --prod --token "$VERCEL_TOKEN"
          echo "result=deployed $built" >> "$GITHUB_OUTPUT"

      - name: Run summary
        if: always()
        run: |
          case "${{ steps.bu.outputs.code }}" in
            0) collection="passed (all three halls, live)";;
            2) collection="partial: some halls failed, so nothing new is published (all-or-nothing)";;
            1) collection="failed for every hall";;
            *) collection="did not run";;
          esac
          {
            echo "### Menu refresh for ${{ steps.bu.outputs.date || 'unknown date' }}"
            echo "| Stage | Result |"
            echo "|---|---|"
            echo "| Collection | $collection |"
            echo "| Validation | ${{ steps.gate.outputs.status || 'skipped (collection did not fully pass)' }} |"
            echo "| Published data | ${{ steps.merge.outputs.published || 'not reached' }} (version ${{ steps.merge.outputs.version || 'n/a' }}) |"
            echo "| Persistence (menu-data branch) | ${{ steps.persist.outputs.done == 'true' && 'pushed' || 'not pushed' }} |"
            echo "| Deployment | ${{ steps.deploy.outputs.result || 'not reached' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail visibly when new data was not published
        id: verdict
        if: steps.bu.outputs.code != '0' || steps.gate.outputs.code != '0' || steps.merge.outputs.code != '0'
        run: |
          echo "Collector exit ${{ steps.bu.outputs.code }}, validation exit ${{ steps.gate.outputs.code }}, merge exit ${{ steps.merge.outputs.code }}."
          echo "The previous snapshot was kept. Reports are in the run artifacts and on the menu-data branch."
          exit 1

      - name: Open or update the failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create menu-refresh --color B37C05 --description "Automated menu refresh failures" --force >/dev/null
          existing="$(gh issue list --label menu-refresh --state open --json number --jq '.[0].number')"
          body="Refresh for ${{ steps.bu.outputs.date }} failed: $RUN_URL (see the run summary). The site keeps the previous menu snapshot."
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "Menu refresh is failing" --label menu-refresh --body "$body"
          fi

      - name: Close the failure issue after a full success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --label menu-refresh --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Refresh for ${{ steps.bu.outputs.date }} succeeded: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          done
